<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#163D32"/>
      <stop offset="1" stop-color="#0B201A"/>
    </linearGradient>
  </defs>
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#1F5948" stroke-width="16"/>

  <!-- Central Pillar of Justice -->
  <line x1="256" y1="130" x2="256" y2="370" stroke="#DCEBDD" stroke-width="26" stroke-linecap="round"/>
  <!-- Top Finial / Apex -->
  <circle cx="256" cy="122" r="22" fill="#E5B869"/>

  <!-- Cross Beam -->
  <line x1="136" y1="184" x2="376" y2="184" stroke="#DCEBDD" stroke-width="26" stroke-linecap="round"/>
  <!-- Fulcrum Pivot -->
  <circle cx="256" cy="184" r="24" fill="#E5B869" stroke="#163D32" stroke-width="10"/>

  <!-- Left Pan Suspension -->
  <line x1="146" y1="190" x2="96" y2="274" stroke="#DCEBDD" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <line x1="146" y1="190" x2="196" y2="274" stroke="#DCEBDD" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <path d="M96 274 C96 320, 196 320, 196 274 Z" fill="#E5B869" fill-opacity="0.35" stroke="#DCEBDD" stroke-width="16" stroke-linejoin="round"/>

  <!-- Right Pan Suspension -->
  <line x1="366" y1="190" x2="316" y2="274" stroke="#DCEBDD" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <line x1="366" y1="190" x2="416" y2="274" stroke="#DCEBDD" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <path d="M316 274 C316 320, 416 320, 416 274 Z" fill="#E5B869" fill-opacity="0.35" stroke="#DCEBDD" stroke-width="16" stroke-linejoin="round"/>

  <!-- Foundation Pedestal -->
  <path d="M180 380 Q256 360 332 380" stroke="#E5B869" stroke-width="24" stroke-linecap="round"/>
  <line x1="192" y1="404" x2="320" y2="404" stroke="#DCEBDD" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
</svg>
