spring.application.name=aram-legal-aid-backend
server.port=8082
server.address=0.0.0.0
spring.profiles.active=mysql

# Development default: H2 in-memory database. Use application-mysql.properties for MySQL.
spring.datasource.url=jdbc:h2:mem:aram_db;DB_CLOSE_DELAY=-1;MODE=MySQL;INIT=CREATE SCHEMA IF NOT EXISTS aram_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MongoDB is enabled for AI logs.
spring.data.mongodb.uri=mongodb://localhost:27017/aram_logs
ai.logs.mongodb.enabled=true

# JWT secret must be at least 32 characters. Must be provided via JWT_SECRET env var.
app.jwt.secret=${JWT_SECRET:ARAMLegalAidJwtSecretKeyForDevelopmentOnly2026}
app.jwt.access-token-expiry-minutes=1440
app.jwt.refresh-token-expiry-days=7

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:3000,http://10.58.17.140:5173,http://10.58.17.140:5174,http://10.1.0.152:5173,http://10.1.0.152:5174}
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.upload.max-size-mb=10
app.ai.external.enabled=false
app.ai.external.url=${AI_SERVICE_URL:http://127.0.0.1:8000}/complaint/analyze

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

management.endpoints.web.exposure.include=health,info
management.health.mongo.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:ouraramsupport@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:csgqaekizdvdcolv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from-name=ARAM Legal Assistance

# SMS Configurations
app.sms.provider=${APP_SMS_PROVIDER:MOCK}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.phone-number=${TWILIO_PHONE_NUMBER:}
app.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
app.sms.msg91.sender-id=${MSG91_SENDER_ID:ARAMSMS}
app.sms.msg91.template-id=${MSG91_TEMPLATE_ID:}

# TTS Configurations
app.tts.provider=${APP_TTS_PROVIDER:BROWSER_FALLBACK}
app.tts.google.api-key=${GOOGLE_TTS_API_KEY:}

# Management Health Configurations
management.endpoint.health.show-details=always
management.health.mail.enabled=false
management.health.mongo.enabled=false
management.health.redis.enabled=false

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

