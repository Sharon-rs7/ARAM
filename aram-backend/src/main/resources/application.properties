spring.application.name=aram-legal-aid-backend
server.port=8080
server.address=0.0.0.0
spring.profiles.active=default

# Development default: H2 in-memory database. Use application-mysql.properties for MySQL.
spring.datasource.url=jdbc:h2:mem:aram_db;DB_CLOSE_DELAY=-1;MODE=MySQL;INIT=CREATE SCHEMA IF NOT EXISTS aram_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MongoDB is optional. Keep disabled until MongoDB is running.
spring.data.mongodb.uri=mongodb://localhost:27017/aram_logs
ai.logs.mongodb.enabled=false

# JWT secret must be at least 32 characters. Must be provided via JWT_SECRET env var.
app.jwt.secret=${JWT_SECRET:ARAMLegalAidJwtSecretKeyForDevelopmentOnly2026}
app.jwt.access-token-expiry-minutes=1440
app.jwt.refresh-token-expiry-days=7

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://10.58.17.140:5173,http://10.1.0.152:5173
app.upload.dir=uploads
app.upload.max-size-mb=10
app.ai.external.enabled=false
app.ai.external.url=http://localhost:8000/complaint/analyze

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

management.endpoints.web.exposure.include=health,info
management.health.mongo.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
ai.service.url=http://localhost:8000

