# ==============================================================================
# ARAM Production Profile Configuration
# Active with: SPRING_PROFILES_ACTIVE=prod,mysql
# ==============================================================================

# Server & Dynamic Cloud Port Support
server.address=0.0.0.0
server.port=${PORT:${SERVER_PORT:8082}}

# Production MySQL Database Configuration (Strictly via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:aram_db}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL:true}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema Validation & Migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true
spring.h2.console.enabled=false

# Security & Secrets (Must be supplied via environment variables in production)
app.jwt.secret=${JWT_SECRET}
app.encryption.key=${APP_ENCRYPTION_KEY}
app.internal-token=${INTERNAL_API_TOKEN}
ai.internal.token=${INTERNAL_API_TOKEN}

# CORS & Allowed Origins (Supports Vercel production frontend)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://aram-lyart.vercel.app}
app.frontend.url=${APP_FRONTEND_URL:https://aram-lyart.vercel.app}

# File Upload Directory (Persistent Volume Mount)
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}

# AI Microservice Connectivity
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}
app.ai.external.url=${AI_SERVICE_URL:http://127.0.0.1:8000}/complaint/analyze
app.ai.external.enabled=false

# Optional Infrastructure (Explicitly disabled initially)
spring.redis.enabled=${SPRING_REDIS_ENABLED:false}
ai.logs.mongodb.enabled=${AI_LOGS_MONGODB_ENABLED:false}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGO_URI:mongodb://localhost:27017/aram_logs}}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.seed.enabled=${APP_SEED_ENABLED:false}

# Actuator Health Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.mongo.enabled=false
management.health.redis.enabled=false
management.health.mail.enabled=false
