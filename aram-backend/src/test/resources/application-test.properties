spring.application.name=aram-legal-aid-backend-test
spring.datasource.url=jdbc:h2:mem:aram_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

ai.logs.mongodb.enabled=false
management.health.mongo.enabled=false
management.health.mail.enabled=false
management.health.redis.enabled=false

app.jwt.secret=TestJwtSecretKeyMustBe32CharactersLongOrMore1234567890!
app.jwt.access-token-expiry-minutes=60
app.jwt.refresh-token-expiry-days=1

app.mail.enabled=false
app.sms.provider=MOCK
app.tts.provider=BROWSER_FALLBACK
app.seed.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

ai.service.url=http://127.0.0.1:8000
app.ai.external.enabled=false
app.internal-token=test-internal-token-32-chars-long-secure!
internal.api.token=test-internal-token-32-chars-long-secure!
ai.internal.token=test-internal-token-32-chars-long-secure!
