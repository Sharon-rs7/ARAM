version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: aram-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPassword2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aram_db}
      MYSQL_USER: ${MYSQL_USER:-aram_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-AramSecurePassword2026!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aram-net

  redis:
    image: redis:7-alpine
    container_name: aram-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aram-net

  mongodb:
    image: mongo:6.0
    container_name: aram-mongo-prod
    restart: always
    environment:
      MONGO_INITDB_DATABASE: aram_ai_logs
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aram-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: aram-auth-prod
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/aram_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-aram_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-AramSecurePassword2026!}
      JWT_SECRET: ${JWT_SECRET:-ARAMSecretKey2026VerySecureLongTokenKeyMustBeAtLeast256Bits}
    networks:
      - aram-net

  aram-backend:
    build:
      context: ./aram-backend
      dockerfile: Dockerfile
    container_name: aram-core-prod
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/aram_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-aram_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-AramSecurePassword2026!}
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-aram-secret-token-2026}
      MAIL_FROM: ouraramsupport@gmail.com
    networks:
      - aram-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aram-ai-prod
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      MONGO_URI: mongodb://mongodb:27017/aram_ai_logs
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-aram-secret-token-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-3.5-flash-lite
      LLM_PROVIDER_PRIMARY: local
      LLM_PROVIDER_FALLBACK: gemini
    networks:
      - aram-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aram-frontend-prod
    restart: always
    depends_on:
      - auth-service
      - aram-backend
      - ai-service
    ports:
      - "5173:80"
    networks:
      - aram-net

volumes:
  mysql_data:
  redis_data:
  mongo_data:

networks:
  aram-net:
    driver: bridge
