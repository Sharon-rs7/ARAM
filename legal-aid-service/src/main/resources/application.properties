server.port=8082
server.address=0.0.0.0

spring.application.name=legal-aid-service

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aram_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:aram}
spring.datasource.password=${DB_PASSWORD:your_desired_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB logging settings
spring.data.mongodb.uri=mongodb://localhost:27017/aram_logs
ai.logs.mongodb.enabled=false

# --- JWT settings ---
# IMPORTANT: this secret must be IDENTICAL to the one in auth-service's
# application.properties. Both services use the same symmetric key: auth-service
# signs tokens with it, legal-aid-service verifies signatures with it - no network
# call between the two services is needed to check a token.
app.jwt.secret=${JWT_SECRET:ARAMLegalAidJwtSecretKeyForDevelopmentOnly2026}
app.jwt.access-token-expiry-minutes=1440
app.jwt.refresh-token-expiry-days=7

# AI Service URL
AI_SERVICE_URL=http://localhost:8000

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Multipart File Size Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
