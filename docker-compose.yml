version: '3.8'

services:
  # --------------------------------------------------------------------------
  # 1. Primary Self-Hosted LLM Inference (vLLM / Qwen)
  # --------------------------------------------------------------------------
  qwen-inference:
    image: vllm/vllm-openai:latest
    container_name: aram-qwen-inference
    restart: unless-stopped
    runtime: nvidia
    environment:
      - MODEL=Qwen/Qwen3-30B-A3B-Instruct
    command: >
      --model Qwen/Qwen3-30B-A3B-Instruct
      --port 8005
      --max-model-len 4096
      --gpu-memory-utilization 0.90
      --trust-remote-code
    networks:
      - aram-internal
    # Internal only — Not exposed to public internet

  # --------------------------------------------------------------------------
  # 2. Database & State Services
  # --------------------------------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: aram-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aram_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - aram-internal

  mongodb:
    image: mongo:6.0
    container_name: aram-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - aram-internal

  redis:
    image: redis:7.0-alpine
    container_name: aram-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aram-internal

  # --------------------------------------------------------------------------
  # 3. Microservices
  # --------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aram-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LLM_PROVIDER_PRIMARY=qwen
      - LLM_PROVIDER_FALLBACK=gemini
      - QWEN_BASE_URL=http://qwen-inference:8005/v1
      - QWEN_MODEL=Qwen/Qwen3-30B-A3B-Instruct
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-1.5-flash
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=aram_logs
    depends_on:
      - qwen-inference
      - redis
      - mongodb
    networks:
      - aram-internal
      - aram-public

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: aram-auth-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/aram_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - JWT_SECRET=ARAMLegalAidJwtSecretKeyMustBe32CharactersOrLonger2026!
    depends_on:
      - mysql-db
    networks:
      - aram-internal
      - aram-public

  aram-backend:
    build:
      context: ./aram-backend
      dockerfile: Dockerfile
    container_name: aram-core-backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/aram_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - JWT_SECRET=ARAMLegalAidJwtSecretKeyMustBe32CharactersOrLonger2026!
      - AI_SERVICE_URL=http://ai-service:8000
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      - mysql-db
      - ai-service
    networks:
      - aram-internal
      - aram-public

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aram-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - aram-backend
      - ai-service
    networks:
      - aram-public

networks:
  aram-internal:
    driver: bridge
  aram-public:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
  redis_data:
