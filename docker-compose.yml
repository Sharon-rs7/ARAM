version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: aram-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aram
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aram-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: ./aram-backend
      dockerfile: Dockerfile
    container_name: aram-backend
    restart: always
    depends_on:
      - mysql-db
      - ai-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/aram?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - DB_PASSWORD=root
      - JWT_SECRET=ARAMLegalAidJwtSecretKeyForDevelopmentOnlyChangeThisNow2026
      - APP_ENCRYPTION_KEY=ARAMLegalAidEncryptionSecretKey2026
      - AI_SERVICE_URL=http://ai-service:8000

volumes:
  mysql_data:
